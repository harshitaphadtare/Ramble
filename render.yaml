# Render blueprint: one web service serves the PWA and /api from the same origin.
# See docs/ARCHITECTURE.md §15. Secrets are set in the Render dashboard (sync: false), never committed.
services:
  - type: web
    runtime: node
    name: ramble
    region: singapore
    # Free plan: no card needed. It sleeps after 15 min idle (first request then takes ~30–60 s);
    # the service worker still serves the app shell instantly on repeat visits. Wake it before demos.
    plan: free
    # NODE_ENV=production makes npm skip devDependencies, but the build needs Vite, TypeScript and tsup.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_TOKEN
        sync: false
      - key: TABPFN_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
